name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pokesift
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: pokesift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pokesift -d pokesift_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests.test_cloud -v
        env:
          TEST_POSTGRES_URL: postgresql://pokesift:fixture-only@127.0.0.1:5432/pokesift_test
      - run: npm run check
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:concepts
      - run: npm run test:collection
      - run: npm run test:foil
      - run: npm run test:motion
      - run: npm run test:cloud
