services:
  - type: web
    name: pokesift-dev
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt && POKESIFT_CLOUD_ENABLED=0 python -m unittest discover -s tests -v
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      # Enable only after the Neon/Google/storage smoke tests in docs/cloud-deployment.md.
      - key: POKESIFT_CLOUD_ENABLED
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: TCGAPI_KEY
        sync: false
      - key: PIKAQIAN_API_KEY
        sync: false
      - key: POKESIFT_PASSWORD
        sync: false
