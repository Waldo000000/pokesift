services:
  - type: web
    name: pokesift-dev
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: TCGAPI_KEY
        sync: false
      - key: POKESIFT_PASSWORD
        sync: false
